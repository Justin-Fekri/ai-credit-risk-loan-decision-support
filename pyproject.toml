[project]
name = "credit-risk-dss"
version = "1.0.0"
description = "AI credit risk and loan decision support system (XGBoost, scikit-learn, TreeSHAP)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "scikit-learn>=1.5,<2",
  "xgboost==2.1.4",
  "shap>=0.46",
  "pandas>=2.2",
  "numpy>=1.26",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "joblib>=1.4",
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
