[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk-loan-decision-support"
version = "1.0.0"
description = "Explainable credit risk scoring with a human-in-the-loop decision layer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "shap>=0.44",
    "matplotlib>=3.8",
    "joblib>=1.3",
    "certifi>=2024.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "streamlit>=1.35", "jupyter>=1.0"]

[project.scripts]
credit-risk = "credit_risk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: end-to-end tests that train a real model"]
filterwarnings = ["ignore::PendingDeprecationWarning"]
