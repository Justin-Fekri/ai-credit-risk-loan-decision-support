name: CI

on:
  push:
    # v2 is included while the rebuilt version is under review on its own
    # branch; drop it once this becomes the default branch.
    branches: [main, v2]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q

      - name: Smoke-test the full pipeline
        run: |
          python -m credit_risk.main generate-data --rows 3000
          python -m credit_risk.main train
          python -m credit_risk.main evaluate
